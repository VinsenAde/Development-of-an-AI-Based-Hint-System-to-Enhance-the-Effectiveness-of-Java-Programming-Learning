<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async Java Runner Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        h1 { margin-top: 0; }
        .grid { display: grid; gap: 16px; }
        textarea, button {
            width: 100%;
            font: inherit;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }
        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
            font-weight: 600;
        }
        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 600;
            background: #e5e7eb;
            color: #374151;
        }
        .status.pending { background: #fef3c7; color: #92400e; }
        .status.running { background: #dbeafe; color: #1d4ed8; }
        .status.success { background: #dcfce7; color: #166534; }
        .status.failed { background: #fee2e2; color: #991b1b; }
        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #111827;
            color: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Async Java Runner Verification</h1>
        <p>Submit Java source and expected output to test the asynchronous execution pipeline.</p>

        <div class="grid">
            <label for="sourceCode">Java Source Code</label>
            <textarea id="sourceCode" rows="12" placeholder="Write your Java code here">public class StudentCode {\n    public static void main(String[] args) {\n        System.out.println(\"Hello from async runner\");\n    }\n}</textarea>

            <label for="expectedOutput">Expected Output</label>
            <textarea id="expectedOutput" rows="5" placeholder="Expected output">Hello from async runner</textarea>

            <button id="submitBtn">Submit</button>

            <div>
                <strong>Status:</strong> <span id="statusBadge" class="status">IDLE</span>
            </div>

            <div>
                <strong>Job ID:</strong> <span id="jobId">-</span>
            </div>

            <label for="logs">Execution Logs</label>
            <pre id="logs">No output yet.</pre>
        </div>
    </div>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const sourceCodeInput = document.getElementById('sourceCode');
        const expectedOutputInput = document.getElementById('expectedOutput');
        const statusBadge = document.getElementById('statusBadge');
        const jobIdEl = document.getElementById('jobId');
        const logsEl = document.getElementById('logs');

        function setStatus(label, state) {
            statusBadge.textContent = label;
            statusBadge.className = 'status ' + (state || label.toLowerCase());
        }

        submitBtn.addEventListener('click', async () => {
            setStatus('PENDING', 'pending');
            logsEl.textContent = 'Submitting job...';

            try {
                const response = await fetch('/api/submissions/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        submissionId: crypto.randomUUID(),
                        sourceCode: sourceCodeInput.value,
                        expectedOutput: expectedOutputInput.value
                    })
                });

                if (!response.ok) {
                    throw new Error('Request failed with status ' + response.status);
                }

                const payload = await response.json();
                const jobId = payload.jobId;
                jobIdEl.textContent = jobId;

                const eventSource = new EventSource('/api/submissions/stream/' + jobId);
                setStatus('RUNNING', 'running');

                eventSource.addEventListener('connected', (event) => {
                    console.log('SSE connected:', event.data);
                });

                eventSource.addEventListener('execution-result', (event) => {
                    const result = JSON.parse(event.data);
                    const output = [
                        'stdout:',
                        result.stdout || '',
                        '',
                        'stderr:',
                        result.stderr || '',
                        '',
                        'passed:', result.passed,
                        'scoreCalculated:', result.scoreCalculated,
                        'exitCode:', result.exitCode
                    ].join('\n');

                    logsEl.textContent = output;
                    setStatus(result.passed ? 'SUCCESS' : 'FAILED', result.passed ? 'success' : 'failed');
                    eventSource.close();
                });

                eventSource.onerror = () => {
                    setStatus('FAILED', 'failed');
                    logsEl.textContent = 'Connection closed or error occurred.';
                    eventSource.close();
                };
            } catch (error) {
                console.error(error);
                setStatus('FAILED', 'failed');
                logsEl.textContent = error.message;
            }
        });
    </script>
</body>
</html>
