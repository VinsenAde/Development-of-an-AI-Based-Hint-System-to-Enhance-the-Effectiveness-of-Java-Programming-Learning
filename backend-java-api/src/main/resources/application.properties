# Change the default port from 8080 to 8081
server.port=8181

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cue_db
spring.datasource.username=postgres
spring.datasource.password=vinsensius1

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disable auto schema generation
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Allow overriding of bean definitions
spring.main.allow-bean-definition-overriding=true

# Enable H2 Console and set its path
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Scoring Settings
hint.scoring.base-score=100
hint.scoring.zero-hint-bonus=6
hint.scoring.score-per-failed-run=2
hint.scoring.time-window-sec=60
hint.scoring.score-per-time-window=1
hint.scoring.fast-finish-bonus=3
hint.scoring.max-final-score=100
#hint.scoring.hint-penalty.syntax=7
#hint.scoring.hint-penalty.logic=13
#hint.scoring.hint-penalty.step=20
#hint.scoring.hint-penalty.reveal=20

# Logging Settings
logging.level.org.springframework.web=DEBUG
logging.level.com.thesis.java=DEBUG
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.hbm2ddl=TRACE
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
